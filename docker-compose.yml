services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: heart_pilot
      POSTGRES_USER: heart_pilot
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-heart_pilot_dev}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U heart_pilot -d heart_pilot"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/heart_pilot
      DATABASE_USERNAME: heart_pilot
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-heart_pilot_dev}
      REDIS_HOST: redis
      REDIS_ENABLED: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-before-production-2026}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://82.157.205.6:8081}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      AMAP_MAPS_API_KEY: ${AMAP_MAPS_API_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-change-me-now}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://localhost:8123/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
  frontend:
    build: ./heart-pilot-frontend
    ports: ["${FRONTEND_PORT:-8081}:80"]
    depends_on:
      backend: { condition: service_healthy }
volumes:
  postgres-data:
  redis-data:
  minio-data:
